<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poc 13.52</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0d0d1a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        /* Grid de fondo animado */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-50px, -50px); }
        }

        /* Círculos de glow */
        .glow-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: pulse 4s ease-in-out infinite;
        }

        .glow-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #00d4ff, transparent);
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }

        .glow-2 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #0066ff, transparent);
            bottom: -50px;
            left: -50px;
            animation-delay: 2s;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.2); opacity: 0.6; }
        }

        /* Contenedor principal */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px;
        }

        /* Título Poc 13.52 */
        .title {
            font-size: 5rem;
            font-weight: 900;
            letter-spacing: 8px;
            margin-bottom: 60px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099ff 50%, #0066ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 60px rgba(0, 212, 255, 0.5);
            animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.5)); }
            to { filter: drop-shadow(0 0 40px rgba(0, 212, 255, 0.8)); }
        }

        /* Botón RUN */
        .run-btn {
            position: relative;
            padding: 25px 100px;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 4px;
            color: #fff;
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 
                0 10px 40px rgba(0, 212, 255, 0.4),
                0 0 0 2px rgba(0, 212, 255, 0.3),
                inset 0 2px 0 rgba(255, 255, 255, 0.3);
        }

        .run-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.6s;
        }

        .run-btn:hover::before {
            left: 100%;
        }

        .run-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 
                0 20px 60px rgba(0, 212, 255, 0.6),
                0 0 0 4px rgba(0, 212, 255, 0.4),
                inset 0 2px 0 rgba(255, 255, 255, 0.4);
        }

        .run-btn:active {
            transform: translateY(-2px) scale(0.98);
            box-shadow: 
                0 5px 20px rgba(0, 212, 255, 0.4),
                0 0 0 2px rgba(0, 212, 255, 0.3);
        }

        /* Efecto de ripple */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0);
            animation: rippleEffect 0.6s linear;
            pointer-events: none;
        }

        @keyframes rippleEffect {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Loading overlay */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 13, 26, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
        }

        .loading.active {
            display: flex;
        }

        .spinner {
            width: 80px;
            height: 80px;
            border: 4px solid rgba(0, 212, 255, 0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 30px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 1.5rem;
            color: #00d4ff;
            letter-spacing: 4px;
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .title { font-size: 3rem; letter-spacing: 4px; }
            .run-btn { padding: 20px 70px; font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="glow-circle glow-1"></div>
    <div class="glow-circle glow-2"></div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">EJECUTANDO...</div>
    </div>

    <div class="container">
        <h1 class="title">Poc 13.52</h1>
        <button class="run-btn" id="runBtn" onclick="execute()">RUN</button>
    </div>

    <script>
        // Efecto ripple en el botón
        document.getElementById('runBtn').addEventListener('click', function(e) {
            const btn = e.currentTarget;
            const rect = btn.getBoundingClientRect();
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            ripple.style.left = (e.clientX - rect.left) + 'px';
            ripple.style.top = (e.clientY - rect.top) + 'px';
            btn.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        });

        // Ejecutar exploit
        function execute() {
            document.getElementById('loading').classList.add('active');
            
            // Redirigir al exploit después de la animación
            setTimeout(() => {
                window.location.href = 'exploit.html';
            }, 2000);
        }
    </script>
</body>
</html>
